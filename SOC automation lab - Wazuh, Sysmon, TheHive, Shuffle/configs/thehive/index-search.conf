# Part of /etc/thehive/application.conf on TheHivelab1.
# Connects TheHive 6.0.0 to Elasticsearch 8 over HTTPS with a dedicated, least-privilege user.
# Passwords are redacted.
index.search {
  backend = elasticsearch
  hostname = ["172.16.0.4"]
  index-name = thehive
  elasticsearch {
    http {
      auth {
        type = basic
        basic {
          username = "thehive"
          password = "<redacted>"
        }
      }
    }
    ssl {
      enabled = true
      truststore {
        # Elasticsearch's self-signed CA (/etc/elasticsearch/certs/http_ca.crt), imported with keytool
        location = "/etc/thehive/es-truststore.p12"
        password = "<redacted>"
      }
    }
  }
}
